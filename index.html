<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ビンテージ映画ポスタームーカー</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">
<div id="app" class="max-w-2xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-center mb-6 text-yellow-400">🎬 映画ポスタームーカー</h1>

  <div class="bg-gray-800 rounded-lg p-4 mb-4">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs text-gray-400 mb-1">映画タイトル</label>
        <input id="title" type="text" placeholder="夕暮れの彼方へ" class="w-full bg-gray-700 rounded px-2 py-2 text-white">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">ジャンル</label>
        <select id="genre" class="w-full bg-gray-700 rounded px-2 py-2 text-white">
          <option>ドラマ</option><option>アクション</option><option>ロマンス</option>
          <option>ホラー</option><option>SF</option><option>コメディ</option>
        </select>
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">キャスト</label>
        <input id="cast" type="text" placeholder="山田 太郎 / 鈴木 花子" class="w-full bg-gray-700 rounded px-2 py-2 text-white">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">公開年</label>
        <input id="year" type="number" value="2024" min="1900" max="2099" class="w-full bg-gray-700 rounded px-2 py-2 text-white">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">キャッチコピー</label>
        <input id="tagline" type="text" placeholder="愛は、時を超える。" class="w-full bg-gray-700 rounded px-2 py-2 text-white">
      </div>
      <div>
        <label class="block text-xs text-gray-400 mb-1">監督</label>
        <input id="director" type="text" placeholder="佐藤 一郎 監督" class="w-full bg-gray-700 rounded px-2 py-2 text-white">
      </div>
    </div>

    <div class="mt-3">
      <label class="block text-xs text-gray-400 mb-2">スタイル</label>
      <div class="flex gap-2">
        <button class="style-btn flex-1 py-2 rounded text-xs font-bold" data-style="retro">1950s白黒</button>
        <button class="style-btn flex-1 py-2 rounded text-xs font-bold" data-style="horror">80sホラー</button>
        <button class="style-btn flex-1 py-2 rounded text-xs font-bold" data-style="cyber">サイバーパンク</button>
      </div>
    </div>

    <button id="generate-btn" class="mt-3 w-full bg-yellow-600 hover:bg-yellow-700 rounded-lg py-2 font-bold">🎬 ポスターを生成</button>
  </div>

  <div class="text-center mb-4">
    <canvas id="poster" width="400" height="560" class="max-w-full mx-auto rounded-lg shadow-xl" style="display:none"></canvas>
  </div>

  <button id="download-btn" class="hidden w-full bg-blue-600 hover:bg-blue-700 rounded-lg py-3 font-bold">💾 PNG保存</button>
</div>
<script>
function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let selectedStyle = 'retro';

const styles = {
  retro: {
    bg: '#1a1a1a', accent: '#E8D5A3', title: '#F5F0E8', sub: '#B8A88A', overlay: 'rgba(20,20,20,0.6)',
    border: '#8B7355', strip: '#D4C49A', name: '1950s クラシック白黒',
    gradient: (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#2d2d2d');
      g.addColorStop(0.5, '#1a1a1a');
      g.addColorStop(1, '#0d0d0d');
      return g;
    }
  },
  horror: {
    bg: '#0d0005', accent: '#CC0000', title: '#FF2222', sub: '#FF8888', overlay: 'rgba(100,0,0,0.3)',
    border: '#660000', strip: '#330000', name: '80s ホラー',
    gradient: (ctx, w, h) => {
      const g = ctx.createRadialGradient(w/2, h/2, 0, w/2, h/2, h);
      g.addColorStop(0, '#1a0005');
      g.addColorStop(1, '#000000');
      return g;
    }
  },
  cyber: {
    bg: '#000820', accent: '#00FFCC', title: '#00FFCC', sub: '#FF00AA', overlay: 'rgba(0,255,200,0.1)',
    border: '#00FFCC', strip: '#001040', name: 'サイバーパンク',
    gradient: (ctx, w, h) => {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, '#000820');
      g.addColorStop(0.5, '#00051a');
      g.addColorStop(1, '#000820');
      return g;
    }
  }
};

document.querySelectorAll('.style-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    selectedStyle = btn.dataset.style;
    document.querySelectorAll('.style-btn').forEach(b => b.className = 'style-btn flex-1 py-2 rounded text-xs font-bold bg-gray-700');
    btn.className = 'style-btn flex-1 py-2 rounded text-xs font-bold bg-yellow-600';
  });
});
document.querySelector('[data-style="retro"]').className = 'style-btn flex-1 py-2 rounded text-xs font-bold bg-yellow-600';

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split('');
  let line = '';
  let lines = [];
  for (let i = 0; i < words.length; i++) {
    const testLine = line + words[i];
    if (ctx.measureText(testLine).width > maxWidth && line !== '') {
      lines.push(line);
      line = words[i];
    } else {
      line = testLine;
    }
  }
  lines.push(line);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * lineHeight));
  return lines.length;
}

document.getElementById('generate-btn').addEventListener('click', () => {
  const titleText = document.getElementById('title').value || '無題の映画';
  const genre = document.getElementById('genre').value;
  const cast = document.getElementById('cast').value || 'スター主演';
  const year = document.getElementById('year').value || '2024';
  const tagline = document.getElementById('tagline').value || '';
  const director = document.getElementById('director').value || '';
  const st = styles[selectedStyle];

  const canvas = document.getElementById('poster');
  canvas.style.display = 'block';
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  // Background
  ctx.fillStyle = st.gradient(ctx, W, H);
  ctx.fillRect(0, 0, W, H);

  // Noise texture simulation
  for (let i = 0; i < 2000; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    ctx.fillStyle = 'rgba(255,255,255,' + Math.random() * 0.03 + ')';
    ctx.fillRect(x, y, 1, 1);
  }

  // Border
  ctx.strokeStyle = st.border;
  ctx.lineWidth = 8;
  ctx.strokeRect(10, 10, W-20, H-20);
  ctx.lineWidth = 2;
  ctx.strokeRect(16, 16, W-32, H-32);

  // Top banner
  ctx.fillStyle = st.strip;
  ctx.fillRect(10, 10, W-20, 50);
  ctx.fillStyle = st.bg;
  ctx.font = 'bold 16px serif';
  ctx.textAlign = 'center';
  ctx.fillText('★ ' + st.name + ' ★', W/2, 42);

  // Abstract art/silhouette (style-specific)
  if (selectedStyle === 'retro') {
    // Simple film-noir style silhouettes
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      ctx.arc(50 + i * 70, 150 + Math.sin(i) * 30, 40 - i*3, 0, Math.PI*2);
      ctx.fill();
    }
    // Moon
    ctx.fillStyle = 'rgba(255,255,220,0.15)';
    ctx.beginPath();
    ctx.arc(W * 0.75, 180, 60, 0, Math.PI*2);
    ctx.fill();
  } else if (selectedStyle === 'horror') {
    // Blood drips
    ctx.fillStyle = 'rgba(200,0,0,0.3)';
    for (let i = 0; i < 8; i++) {
      const x = 40 + i * 45;
      ctx.beginPath();
      ctx.moveTo(x, 60);
      ctx.lineTo(x, 60 + 30 + Math.random() * 100);
      ctx.lineWidth = 3 + Math.random() * 4;
      ctx.strokeStyle = 'rgba(200,0,0,0.5)';
      ctx.stroke();
    }
  } else {
    // Cyber grid
    ctx.strokeStyle = 'rgba(0,255,200,0.1)';
    ctx.lineWidth = 1;
    for (let i = 0; i < W; i += 30) {
      ctx.beginPath(); ctx.moveTo(i, 60); ctx.lineTo(i, H-100); ctx.stroke();
    }
    for (let j = 60; j < H-100; j += 30) {
      ctx.beginPath(); ctx.moveTo(20, j); ctx.lineTo(W-20, j); ctx.stroke();
    }
    // Neon glow circles
    for (let k = 0; k < 3; k++) {
      const gx = 80 + k * 110;
      const gy = 180 + k * 30;
      const grad = ctx.createRadialGradient(gx, gy, 0, gx, gy, 60);
      grad.addColorStop(0, 'rgba(0,255,200,0.3)');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(gx, gy, 60, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // Tagline
  if (tagline) {
    ctx.font = 'italic 16px serif';
    ctx.fillStyle = st.sub;
    ctx.textAlign = 'center';
    ctx.fillText(tagline, W/2, 290);
  }

  // Title
  ctx.textAlign = 'center';
  const titleSize = Math.min(48, 1600 / titleText.length);
  ctx.font = `bold ${titleSize}px serif`;
  ctx.fillStyle = st.title;
  ctx.shadowColor = st.accent;
  ctx.shadowBlur = selectedStyle === 'cyber' ? 20 : 5;
  wrapText(ctx, titleText, W/2, 340, W - 60, titleSize + 10);
  ctx.shadowBlur = 0;

  // Genre badge
  ctx.fillStyle = st.accent;
  ctx.fillRect(W/2 - 50, 420, 100, 24);
  ctx.fillStyle = st.bg;
  ctx.font = 'bold 13px sans-serif';
  ctx.fillText(genre, W/2, 436);

  // Cast
  ctx.font = '14px sans-serif';
  ctx.fillStyle = st.sub;
  ctx.fillText(cast, W/2, 470);

  // Director & Year
  ctx.font = '12px sans-serif';
  ctx.fillStyle = st.sub;
  ctx.fillText(director, W/2, 500);

  // Bottom strip
  ctx.fillStyle = st.strip;
  ctx.fillRect(10, H-60, W-20, 50);
  ctx.fillStyle = st.bg;
  ctx.font = 'bold 20px serif';
  ctx.textAlign = 'center';
  ctx.fillText(year, W/2, H-27);

  document.getElementById('download-btn').classList.remove('hidden');
});

document.getElementById('download-btn').addEventListener('click', () => {
  const canvas = document.getElementById('poster');
  const a = document.createElement('a');
  a.download = 'movie-poster.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
});
</script>
</body>
</html>
